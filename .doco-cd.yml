# doco-cd deploy config. The controller on the gaias-choice VM polls this repo
# (second entry in that repo's deploy/controller/poll.yaml) and reconciles
# deploy/app/ on every push to main. Non-secrets only — this stack has no
# secrets: the first steward code is generated on first boot and read from
# `docker logs`. BE_TAG is rolled by .github/workflows/build-backend.yml.
name: mokri-potok
working_dir: deploy/app
environment:
  PUSH_SUBJECT: https://vas.mokri-potok.si/
  BE_TAG: sha-bba1bfd433c0305ab13c9f481135bb0379f216c5
reconciliation:
  events: [unhealthy]
