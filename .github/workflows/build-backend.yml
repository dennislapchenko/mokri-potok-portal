name: Build backend image

# Builds backend/Dockerfile, pushes to GHCR, then rolls BE_TAG in .doco-cd.yml so
# the VM's doco-cd reconciles the new image. Copied from gaias-choice. The GHCR
# package must be public for the VM to pull anonymously (Package settings →
# Change visibility — one-time, after the first push).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/build-backend.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: cd backend && go vet ./... && go test ./...
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dennislapchenko/mokri-potok-portal-be
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Roll BE_TAG for doco-cd
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main
          git checkout -B main origin/main
          sed -E -i "s|^(  BE_TAG: ).*|\1${tag}|" .doco-cd.yml
          grep -q "^  BE_TAG: ${tag}\$" .doco-cd.yml
          if git diff --quiet -- .doco-cd.yml; then echo "already ${tag}"; exit 0; fi
          git add .doco-cd.yml
          git commit -m "deploy: roll backend image to ${tag} [skip ci]"
          git push origin main
