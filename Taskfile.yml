version: "3"

# This repo deploys; the code is porta-pagi. Everything here talks to the VM.
tasks:
  default:
    cmds: [task --list]
  roll:
    desc: 'run a porta-pagi build on the VM: task roll -- sha-<commit> (the tag its CI pushed to GHCR)'
    cmds:
      - test -n "{{.CLI_ARGS}}" || { echo "which tag? task roll -- sha-<commit>"; exit 1; }
      # A typo would land on the VM as a failing pull: the tag must exist, and be public, before anything is written.
      # Credential-less on purpose — this machine is logged in to ghcr.io, the VM is not.
      - DOCKER_CONFIG=$(mktemp -d) docker manifest inspect ghcr.io/dennislapchenko/porta-pagi:{{.CLI_ARGS}} >/dev/null
      - git diff --quiet && git diff --cached --quiet || { echo "commit or stash first"; exit 1; }
      - git pull -q --rebase origin main
      - perl -pi -e 's|^(  BE_TAG: ).*|${1}{{.CLI_ARGS}}|' .doco-cd.yml
      - grep -q "^  BE_TAG: {{.CLI_ARGS}}$" .doco-cd.yml
      - git add .doco-cd.yml && git commit -m "deploy: roll portal to {{.CLI_ARGS}}" && git push origin main
  vm:logs:
    desc: tail the backend on the VM (bootstrap code shows here on first boot)
    cmds: ["ssh -p 13337 -i ~/.ssh/gaia root@gaias-choice.gardenofatlantis.com 'docker logs --tail 100 -f mokri-potok-potok-api-1'"]
  vm:code:
    desc: 'fresh invite link for a house on the VM (no name lists the houses): task vm:code -- "<house>"'
    cmds:
      - ssh -p 13337 -i ~/.ssh/gaia root@gaias-choice.gardenofatlantis.com 'docker exec mokri-potok-potok-api-1 /server code "{{.CLI_ARGS}}"'
  vm:codex:
    desc: 'import the adopted codex once, from a JSON file: task vm:codex -- codex.json (shape in porta-pagi, backend/internal/httpapi/codex.go)'
    cmds:
      - ssh -p 13337 -i ~/.ssh/gaia root@gaias-choice.gardenofatlantis.com 'docker exec -i mokri-potok-potok-api-1 /server codex-import' < "{{.CLI_ARGS}}"
  vm:map:
    desc: 'import the map data from deploy/map into the village database: task vm:map (parcels with source and snapshot date, then water)'
    cmds:
      - ssh -p 13337 -i ~/.ssh/gaia root@gaias-choice.gardenofatlantis.com 'docker exec -i mokri-potok-potok-api-1 /server map-import parcels GURS 2026-08-15' < deploy/map/parcels.geojson
      - ssh -p 13337 -i ~/.ssh/gaia root@gaias-choice.gardenofatlantis.com 'docker exec -i mokri-potok-potok-api-1 /server map-import water' < deploy/map/water.json
  vm:backdrop:
    desc: 'the picture behind the gate, from a file: task vm:backdrop -- picture.jpg (jpeg, png or webp, under 2 MB)'
    cmds:
      - ssh -p 13337 -i ~/.ssh/gaia root@gaias-choice.gardenofatlantis.com 'docker exec -i mokri-potok-potok-api-1 /server site-import backdrop' < "{{.CLI_ARGS}}"
  vm:backup:
    desc: copy the latest SQLite backup from the VM to ./backups/
    cmds: ["mkdir -p backups && scp -P 13337 -i ~/.ssh/gaia 'root@gaias-choice.gardenofatlantis.com:/srv/mokri-potok/data/backups/*.db' backups/"]
